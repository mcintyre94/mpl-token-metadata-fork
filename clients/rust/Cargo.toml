[package]
authors = ["Metaplex Developers <dev@metaplex.com>"]
description = "Metaplex Token Metadata SDK"
edition = "2021"
license-file = "../../LICENSE"
name = "mpl-token-metadata"
readme = "README.md"
repository = "https://github.com/metaplex-foundation/mpl-token-metadata"
version = "5.1.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
anchor = ["dep:anchor-lang"]
anchor-idl-build = ["anchor", "anchor-lang?/idl-build"]
serde = ["dep:serde", "dep:serde_with"]
test-sbf = []
fetch = ["dep:solana-client", "dep:solana-sdk"]

[dependencies]
anchor-lang = { version = "~0.31", optional = true }
borsh = "0.10.3"
kaigan = "0.2.6"
num-derive = "^0.3"
num-traits = "^0.2"
serde = { version = "^1.0", features = ["derive"], optional = true }
serde_with = { version = "^3.0", optional = true }
solana-account = "~2.2"
solana-account-info = "~2.3"
solana-client = { version = "~2.3", optional = true }
solana-cpi = "~2.2"
solana-instruction = "~2.3"
solana-program-error = "~2.2"
solana-pubkey = { version = "~2.4", features = ["borsh", "curve25519"] }
solana-sdk = { version = "~2.3", optional = true }
thiserror = "2.0.12"

[dev-dependencies]
assert_matches = "1.5.0"
solana-program = "~2.3"
solana-program-test = "~2.3"
solana-sdk = "~2.3"
spl-associated-token-account = { version = ">= 1.1.3", features = [
  "no-entrypoint",
] }
spl-token = { version = ">= 3.5.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = ">=0.8.0", features = ["no-entrypoint"] }
test-case = "3.1.0"
